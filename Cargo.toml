[package]
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
description = "The Orbital Windowing System and Compositor"
license-file = "LICENSE"
name = "orbital"
readme = "README.md"
repository = "https://gitlab.redox-os.org/redox-os/orbital"
version = "0.1.0"
edition = "2024"

[dependencies]
redox-log = "0.1"
log = "0.4.14"
orbclient = "0.4"
orbfont = "0.4.0"
redox_syscall = { version = "0.9.0", features = ["std"] }
redox-scheme = "0.11"
serde = "1"
serde_derive = "1"
thiserror = "2.0.12"
toml = "1.1.2+spec-1.1.0"
libc = "0.2.48"
orbimage = "0.1"
# Downgrade due to improper x86 CPU feature detection
ab_glyph_rasterizer = "0.1.10"
libredox = "0.1.3"
redox_event = { version = "0.4" }

[patch.crates-io]
orbimage = { path = "../orbimage" }
orbclient = { git = "https://gitlab.redox-os.org/redox-os/orbclient.git" }
